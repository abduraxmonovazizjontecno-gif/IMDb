[tool.ruff]
target-version = "py311"
line-length = 120
src = ["apps", "IMDb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # function call in default arguments (Django Form patterns)
    "SIM108", # ternary readability preference
]

[tool.ruff.lint.per-file-ignores]
"apps/migrations/*" = ["E501", "I"]
"apps/tests.py" = ["E501"]
"apps/management/commands/seed_catalog.py" = ["E501"]